[project]
name = "interviewcopilot-backend"
version = "0.1.0"
description = "InterviewCopilot FastAPI backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "motor>=3.6",
    "pyjwt>=2.10",
    "authlib>=1.4",
    "itsdangerous>=2.2.0",
    "boto3>=1.43.123",
    "langgraph>=1.2.19",
    "pypdf>=6.21.4",
    "python-multipart>=0.0.33",
    "nats-py>=2.16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
    "pre-commit>=4.0",
    "mongomock-motor>=0.0.35",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: hits the real LLM gateway (skip unless RUN_LIVE_EVAL=1)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

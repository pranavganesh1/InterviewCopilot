server {
    listen 80;

    # Docker's internal DNS, re-resolved per request: backend-api gets
    # recreated on deploys and nginx must not cache its IP (M9 lesson).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend-api:8000;

    # Backend API (Docker network service name)
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;   # track authoring makes 4-6 LLM calls
    }

    # SPA fallback
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}

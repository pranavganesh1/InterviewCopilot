name: interviewcopilot

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-interview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interview}
      POSTGRES_DB: ${POSTGRES_DB:-interviewcopilot}
    ports:
      # Host port 5433: native PostgreSQL on Windows often occupies 127.0.0.1:5432
      # (same rationale as Mongo → 27018). Container still listens on 5432 in-network.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-interview}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    # Host port 27018: a native MongoDB service may already occupy 127.0.0.1:27017
    # on Windows dev machines, which would silently capture localhost connections.
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    # Pinned by digest (ListBuckets quirk in 4.50 is what our code adapts to).
    image: chrislusf/seaweedfs@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-master.volumeSizeLimitMB=1024", "-volume.max=0", "-ip=seaweedfs"]
    ports:
      - "9000:8333"
      - "9333:9333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      # weed binds to the container IP (advertised as -ip=seaweedfs), not 127.0.0.1,
      # so probe via the service hostname that compose DNS provides in-container.
      test: ["CMD-SHELL", "wget -q -O- http://seaweedfs:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2
    # -sd /data: JetStream storage directory (persisted by the volume below so
    # unconsumed feedback jobs survive container restarts).
    command: ["-js", "-sd", "/data", "-m", "8222"]
    # nats:2 is a scratch-based image with no shell — no in-container healthcheck
    # possible. Health is verified via the monitor endpoint on host port 8222.
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-master}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY:-}
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "timeout 10 bash -c ':> /dev/tcp/127.0.0.1/4000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend-api:
    build: ../backend
    # "no": Docker Desktop restarts otherwise steal :8000 from host `uv run uvicorn`.
    restart: "no"
    # No --reload in Docker: the Windows bind-mount __pycache__ churn triggers
# continuous reloads that kill in-flight requests. Code changes = rebuild.
    entrypoint: ["/app/entrypoint.sh", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://interview:interview@postgres:5432/interviewcopilot
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-interviewcopilot}
      NATS_URL: nats://nats:4222
      LITELLM_URL: http://litellm:4000
      # SeaweedFS S3 listens on 8333 in-network; host maps 9000→8333.
      S3_ENDPOINT_URL: http://seaweedfs:8333
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/v1/auth/google/callback}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET:-${JWT_SECRET}}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend-worker:
    build: ../backend
    # "no": avoid competing with host `uv run python -m app.workers.feedback_worker`.
    restart: "no"
    entrypoint: ["/opt/venv/bin/python", "-m", "app.workers.feedback_worker"]
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://interview:interview@postgres:5432/interviewcopilot
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-interviewcopilot}
      NATS_URL: nats://nats:4222
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-master}
      # SeaweedFS S3 listens on 8333 in-network; host maps 9000→8333.
      S3_ENDPOINT_URL: http://seaweedfs:8333
      JWT_SECRET: ${JWT_SECRET}
      FEEDBACK_CATCH_UP_INTERVAL_SECONDS: ${FEEDBACK_CATCH_UP_INTERVAL_SECONDS:-300}
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      nats:
        condition: service_started

  frontend:
    build: ../frontend
    restart: "no"
    ports:
      - "8080:80"
    depends_on:
      backend-api:
        condition: service_healthy

volumes:
  postgres_data:
  mongo_data:
  seaweedfs_data:
  nats_data:

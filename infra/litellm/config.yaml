router_settings:
  # NIM is primary (Groq key not set). Gemini as fallback.
  # When Groq key is added it will be primary again — just reorder.
  fallbacks:
    - {"interview-chat": ["interview-chat-gemini"]}
    - {"structured-json": ["structured-json-gemini"]}

model_list:
  - model_name: interview-chat
    litellm_params:
      model: openai/nvidia/nemotron-3.5-super-vl-120b-a12b
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_NIM_API_KEY
  - model_name: interview-chat-gemini
    litellm_params:
      model: gemini/gemini-flash-latest
      api_key: os.environ/GEMINI_API_KEY
  - model_name: structured-json
    litellm_params:
      model: openai/nvidia/nemotron-3.5-super-vl-120b-a12b
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_NIM_API_KEY
      response_format: {"type": "json_object"}
  - model_name: structured-json-gemini
    litellm_params:
      model: gemini/gemini-flash-latest
      api_key: os.environ/GEMINI_API_KEY

litellm_settings:
  num_retries: 0
  timeout: 120

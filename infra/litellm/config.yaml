router_settings:
  # Multi-tier resilience: when Groq 429s/exhausts rate limits, LiteLLM
  # falls back to NVIDIA NIM (Llama 3.3 70B), then Gemini as tertiary.
  fallbacks:
    - {"interview-chat": ["interview-chat-nim", "interview-chat-gemini"]}
    - {"structured-json": ["structured-json-nim", "structured-json-gemini"]}

model_list:
  - model_name: interview-chat
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
  - model_name: interview-chat-nim
    litellm_params:
      model: openai/meta/llama-3.3-70b-instruct
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_NIM_API_KEY
  - model_name: interview-chat-gemini
    litellm_params:
      model: gemini/gemini-flash-latest
      api_key: os.environ/GEMINI_API_KEY
  - model_name: structured-json
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      response_format: {"type": "json_object"}
  - model_name: structured-json-nim
    litellm_params:
      model: openai/meta/llama-3.3-70b-instruct
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_NIM_API_KEY
      response_format: {"type": "json_object"}
  - model_name: structured-json-gemini
    litellm_params:
      model: gemini/gemini-flash-latest
      api_key: os.environ/GEMINI_API_KEY

litellm_settings:
  # Our gateway owns 429 backoff / fallback fan-out. LiteLLM-internal retries
  # would multiply provider calls and worsen rate limits.
  num_retries: 0
  timeout: 120
